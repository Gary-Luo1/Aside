name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 类型检查
        run: npm run extension:typecheck
      - name: 代码检查
        run: npm run lint
      - name: 单元测试
        run: npm run test
      - name: 格式检查
        run: npm run format:check
      - name: 构建发布包
        run: npm run extension:pack
      - name: 留存构建产物
        uses: actions/upload-artifact@v4
        with:
          name: aside-extension
          path: extension/release/*.zip
          if-no-files-found: error
